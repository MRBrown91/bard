services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bard
      POSTGRES_USER: bard
      POSTGRES_PASSWORD: bard
    ports:
      - "5433:5432"
    volumes:
      - bard_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bard -d bard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bard_postgres:
