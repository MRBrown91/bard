<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bard Test Console</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; min-height: 120px; }
    button { margin-top: 1rem; padding: 0.6rem 1rem; }
    pre { background: #eee; padding: 1rem; min-height: 100px; }
  </style>
</head>
<body>
  <h1>Bard Test Console</h1>
  <p>Phase 1 sends transcript text to the backend WebSocket.</p>
  <textarea id="transcript">You approach LarkFellow.</textarea>
  <br>
  <button id="send">Send transcript</button>
  <pre id="output"></pre>

  <script>
    const output = document.getElementById("output");
    const socket = new WebSocket(`ws://${location.hostname}:8000/ws/stream`);

    socket.addEventListener("message", (event) => {
      output.textContent = event.data;
    });

    document.getElementById("send").addEventListener("click", () => {
      socket.send(JSON.stringify({
        transcript: document.getElementById("transcript").value
      }));
    });
  </script>
</body>
</html>
